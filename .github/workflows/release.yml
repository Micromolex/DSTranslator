name: Release APK

# Запуск: проставить тег и отправить его на GitHub.
#   git tag v1.6.0 && git push origin v1.6.0
#
# Если APK с нужным именем уже прикреплён к релизу (сборка сделана локально
# релизным ключом), сборка пропускается: без секретов CI подписал бы APK
# отладочным ключом и он не встал бы поверх установленного приложения.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Версию читаем из build.gradle.kts до всех тяжёлых шагов — она нужна,
      # чтобы узнать имя файла в релизе.
      - uses: actions/checkout@v4

      - name: Check whether the release already has a signed APK
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(grep -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$NAME" ]; then
            echo "Не удалось прочитать versionName из app/build.gradle.kts" >&2
            exit 1
          fi
          FILE="DeepSeekTranslate-$NAME.apk"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          if gh release view "$GITHUB_REF_NAME" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx "$FILE"; then
            echo "$FILE уже в релизе — сборка не нужна"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - if: steps.check.outputs.skip == 'false'
        uses: android-actions/setup-android@v3

      # Секрет ANDROID_KEYSTORE_B64 — это keystore/deepseek-translate.jks
      # в base64 (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('keystore\deepseek-translate.jks'))).
      # Без секрета сборка подпишется отладочным ключом — для обновления поверх
      # установленного приложения это НЕ подойдёт.
      - name: Restore signing key
        if: ${{ steps.check.outputs.skip == 'false' && secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > keystore/deepseek-translate.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/deepseek-translate.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        if: steps.check.outputs.skip == 'false'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Collect APK and manifest
        if: steps.check.outputs.skip == 'false'
        id: out
        run: |
          # versionCode/versionName читаем прямо из build.gradle.kts — это и есть
          # те значения, что попали в APK.
          CODE=$(grep -oP '^\s*versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then
            echo "Не удалось прочитать версию из app/build.gradle.kts" >&2
            exit 1
          fi
          echo "code=$CODE name=$NAME"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/DeepSeekTranslate-$NAME.apk"
          cat > out/update.json <<EOF
          {
            "versionCode": $CODE,
            "versionName": "$NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/DeepSeekTranslate-$NAME.apk",
            "notes": "Сборка от $(date -u +%Y-%m-%d).",
            "minVersionCode": 0
          }
          EOF
          cat out/update.json

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/DeepSeekTranslate-*.apk
            out/update.json
          generate_release_notes: true
